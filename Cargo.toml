[package]
name = "iced-webview"
version = "0.1.0"
edition = "2024"

[features]
default = []

[dependencies]
cef = { version = "147", features = ["accelerated_osr"] }

iced = { git = "https://github.com/iced-rs/iced", features = ["tokio", "advanced", "lazy", "image", "time-travel"], branch = "master" }
iced_core = { git = "https://github.com/iced-rs/iced" }
iced_wgpu = { git = "https://github.com/iced-rs/iced" }

tracing = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["sync"] }
camino = "1"
url = "2"
atomic-take = "1"
thiserror = "1"
tokio-stream = "0"
anyhow = "1"
serde_json = "1"
wgpu = "28"
serde = { version = "1", features = ["derive"] }
either = "1"
bytemuck = "1"
arc-swap = "1"

[dev-dependencies]
anyhow = "1"

[[example]]
name = "webview"
path = "examples/webview.rs"

[profile.dev.package.objc2]
debug-assertions = false

[profile.release]
debug = true
